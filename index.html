<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Usuarios</title>
<!--uso de bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

 <!--uso de css-->   
    <link rel="stylesheet" href="style.css">

</head>
<body>

 <!--container para margenes ycentrar titulo-->   
    <div class="container mt-5">

    <h1 class="text-center mb-4">Panel Gestión de Usuarios</h1>

 <!-- creacion de formulario para nombre edad -->
  <div class="card p-4 mb-4">

    <label>Nombre</label>
            <input type="text" id="nombre" class="form-control">
        </div>

        <div class="mb-3">
            <label>Edad</label>
            <input type="number" id="edad" class="form-control">
  </div>

  <!-- distincion de roles usuario o administrador a traves de un selector de roles que se despliega -->
 <div class="mb-3">
            <label>Rol</label>
            <select id="rol" class="form-select">
                <option value="">Seleccione</option>
                <option value="Administrador">Administrador</option>
                <option value="Usuario">Usuario</option>
            </select>
        </div>

  
  <!-- boton bootstrap para agregar usuario seleccionado al hacer click-->      
        <button class="btn btn-primary" onclick="agregarUsuario()">
            Agregar Usuario
        </button>

    </div>

     <!-- filtro, el cual permite el filtrado al cambiar de opcion entre todos, adm y usuarios -->
    <div class="mb-3">

        <select id="filtro" class="form-select" onchange="filtrarUsuarios()">
            <option value="Todos">Todos</option>
            <option value="Administrador">Administradores</option>
            <option value="Usuario">Usuarios</option>
        </select>

    </div>

        <!-- boton para ordenar a los usuarios por edad -->
    <button class="btn btn-secondary mb-3" onclick="ordenarPorEdad()">
        Ordenar por Edad
    </button>

    <!-- contador para revisar usuarios activos e inactivos -->
    <div class="mb-3">
        <p id="contadorActivos"></p>
        <p id="contadorInactivos"></p>
    </div>

    <!-- tabla con cplumnas qu contienen datos como nombre, edad, rol y el estado y acciones-->
    <table class="table table-bordered">

        <thead class="table-dark">
            <tr>
                <th>Nombre</th>
                <th>Edad</th>
                <th>Rol</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
        </thead>

        <tbody id="tablaUsuarios">

        </tbody>

    </table>

</div>
</body>
</html>
