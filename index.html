<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Usuarios</title>
<!--uso de bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

 <!--uso de css-->   
    <link rel="stylesheet" href="style.css">

</head>
<body>

 <!--container para margenes ycentrar titulo-->   
    <div class="container mt-5">

    <h1 class="text-center mb-4">Panel Gestión de Usuarios</h1>

 <!-- creacion de formulario para nombre edad -->
  <div class="card p-4 mb-4">

    <label>Nombre</label>
            <input type="text" id="nombre" class="form-control">
        </div>

        <div class="mb-3">
            <label>Edad</label>
            <input type="number" id="edad" class="form-control">
  </div>

  <!-- distincion de roles usuario o administrador a traves de un selector de roles que se despliega -->
 <div class="mb-3">
            <label>Rol</label>
            <select id="rol" class="form-select">
                <option value="">Seleccione</option>
                <option value="Administrador">Administrador</option>
                <option value="Usuario">Usuario</option>
            </select>
        </div>

  
  <!-- boton bootstrap para agregar usuario seleccionado al hacer click-->      
        <button class="btn btn-primary" onclick="agregarUsuario()">
            Agregar Usuario
        </button>

    </div>

</body>
</html>
