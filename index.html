<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Usuarios</title>
<!--uso de bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

 <!--uso de css-->   
    <link rel="stylesheet" href="style.css">

</head>
<body>

 <!--container para márgenes y centrar título-->   
    <div class="container mt-5">
        <h1 class="text-center mb-4">Panel Gestión de Usuarios</h1>

        <!-- Creación de formulario para nombre y edad -->
        <div class="card p-4 mb-4 shadow-sm">
            <div class="mb-3">
                <label>Nombre</label>
                <input type="text" id="nombre" class="form-control">
            </div>

            <div class="mb-3">
                <label>Edad</label>
                <input type="number" id="edad" class="form-control">
            </div>

            <!-- Distinción de roles usuario o administrador a través de un selector de roles que se despliega -->
            <div class="mb-3">
                <label>Rol</label>
                <select id="rol" class="form-select">
                    <option value="">Seleccione</option>
                    <option value="Administrador">Administrador</option>
                    <option value="Usuario">Usuario</option>
                </select>
            </div>

            <!-- Botón bootstrap para agregar usuario seleccionado al hacer click-->      
            <button class="btn btn-primary" onclick="agregarUsuario()">
                Agregar Usuario
            </button>
        </div>

        <div class="row g-3 align-items-center mb-3">
            <div class="col-md-8">
                <select id="filtro" class="form-select" onchange="filtrarUsuarios()">
                    <option value="Todos">Todos</option>
                    <option value="Administrador">Administradores</option>
                    <option value="Usuario">Usuarios</option>
                </select>
            </div>
            <div class="col-md-4 text-md-end">
                <button class="btn btn-secondary w-100 w-md-auto" onclick="ordenarPorEdad()">
                    Ordenar por Edad
                </button>
            </div>
        </div>

        <!-- Contador para revisar usuarios activos e inactivos -->
        <div class="mb-3">
            <p id="contadorActivos"></p>
            <p id="contadorInactivos"></p>
        </div>

        <!-- Tabla con columnas que contienen datos como nombre, edad, rol y estado y acciones-->
        <div class="table-responsive shadow-sm rounded">
            <table class="table table-bordered mb-0 align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>Nombre</th>
                        <th>Edad</th>
                        <th>Rol</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaUsuarios">
                </tbody>
            </table>
        </div>
    </div>

<script src="script.js"></script>

</body>
</html>
